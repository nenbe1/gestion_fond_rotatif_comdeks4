      responses:
        '200': { description: Groupe désactivé }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /groupes-mmf/{id}/activer:
    put:
      tags: [Groupes MMF]
      summary: Réactiver un groupe
      description: Réservé au comité.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Groupe réactivé }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /groupes-mmf/{id}/membres:
    get:
      tags: [Groupes MMF]
      summary: Lister les membres d'un groupe
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Liste des adhésions }
    post:
      tags: [Groupes MMF]
      summary: Ajouter un bénéficiaire au groupe
      description: Réservé au comité.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [beneficiaire_id], properties: { beneficiaire_id: { type: integer } } }
      responses:
        '201': { description: Adhésion créée }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /groupes-mmf/{id}/membres/{adhesionId}:
    delete:
      tags: [Groupes MMF]
      summary: Retirer un bénéficiaire du groupe
      description: Réservé au comité.
      parameters:
        - { $ref: '#/components/parameters/IdEnChemin' }
        - name: adhesionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Retiré }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /groupes-mmf/{id}/responsable:
    put:
      tags: [Groupes MMF]
      summary: Désigner le bénéficiaire responsable du groupe
      description: Réservé au comité.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [beneficiaire_id], properties: { beneficiaire_id: { type: integer } } }
      responses:
        '200': { description: Responsable désigné }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  # =====================================================================
  # COTISATIONS
  # =====================================================================
  /cotisations:
    post:
      tags: [Cotisations]
      summary: Enregistrer une cotisation
      description: Réservé au comité — le bénéficiaire remet sa cotisation en main propre, le comité l'enregistre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupe_mmf_id, beneficiaire_id, montant]
              properties:
                groupe_mmf_id: { type: integer }
                beneficiaire_id: { type: integer }
                montant: { type: number, minimum: 0.01 }
                observation: { type: string, nullable: true }
      responses:
        '201': { description: Cotisation enregistrée, reçu PDF généré }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }
    get:
      tags: [Cotisations]
      summary: Rechercher des cotisations
      parameters:
        - name: beneficiaireId
          in: query
          schema: { type: integer }
        - name: groupeMmfId
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Liste des cotisations correspondantes }

  /cotisations/{id}:
    get:
      tags: [Cotisations]
      summary: Consulter une cotisation par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail de la cotisation }
    put:
      tags: [Cotisations]
      summary: Modifier une cotisation
      description: Seuls montant et observation sont modifiables (jamais le bénéficiaire ni le groupe). Réservé au comité.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                montant: { type: number, minimum: 0.01 }
                observation: { type: string }
      responses:
        '200': { description: Cotisation modifiée }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /cotisations/{id}/recu:
    get:
      tags: [Cotisations]
      summary: Télécharger le reçu PDF de la cotisation
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Fichier PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }

  /cotisations/{id}/annuler:
    put:
      tags: [Cotisations]
      summary: Annuler une cotisation
      description: Annulation logique (jamais de suppression) — reste visible dans l'historique. Réservé au comité.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Cotisation annulée }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /cotisations/total/{beneficiaireId}/{groupeId}:
    get:
      tags: [Cotisations]
      summary: Total cotisé par un bénéficiaire dans un groupe donné
      parameters:
        - name: beneficiaireId
          in: path
          required: true
          schema: { type: integer }
        - name: groupeId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Montant total }

  # =====================================================================
  # NOTIFICATIONS
  # =====================================================================
  /notifications:
    get:
      tags: [Notifications]
      summary: Lister mes notifications (utilisateur connecté)
      description: Chaque compte ne voit que ses propres notifications.
      responses:
        '200': { description: Liste des notifications, content: { application/json: { schema: { type: object, properties: { notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } } } }

  /notifications/non-lues/nombre:
    get:
      tags: [Notifications]
      summary: Nombre de notifications non lues (pour le badge)
      responses:
        '200': { description: 'Compteur', content: { application/json: { schema: { type: object, properties: { nombre: { type: integer } } } } } }

  /notifications/toutes/lues:
    put:
      tags: [Notifications]
      summary: Marquer toutes mes notifications comme lues
      responses:
        '200': { description: Notifications marquées comme lues }

  /notifications/{id}/lue:
    put:
      tags: [Notifications]
      summary: Marquer une notification comme lue
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Notification marquée comme lue }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token obtenu via POST /authentification/connexion, valable 7 jours.'

  parameters:
    IdEnChemin:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Identifiant de la ressource

  responses:
    ErreurValidation:
      description: Données invalides
      content:
        application/json:
          schema:
            type: object
            properties:
              erreurs: { type: array, items: { type: string } }
    ErreurAcces:
      description: Accès refusé (rôle ou habilitation insuffisante)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErreurSimple' }
    ErreurNonTrouve:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErreurSimple' }

  schemas:
    ErreurSimple:
      type: object
      properties:
        message: { type: string }

    ReponseAuth:
      type: object
      properties:
        token: { type: string, description: JWT à transmettre dans Authorization Bearer }
        utilisateur:
          type: object
          properties:
            id: { type: integer }
            nom: { type: string }
            prenom: { type: string }
            role: { type: string, enum: [RESPONSABLE, MEMBRE_COMITE, BENEFICIAIRE, AUTORITE] }

    Beneficiaire:
      type: object
      properties:
        id: { type: integer }
        utilisateurId: { type: integer }
        cantonId: { type: integer, nullable: true }
        nom: { type: string }
        prenom: { type: string }
        sexe: { type: string, enum: [M, F] }
        telephone: { type: string }
        photo: { type: string, nullable: true, description: 'Chemin relatif, ex. /uploads/beneficiaires/xxx.jpg' }
        ageEstime: { type: integer, nullable: true }
        activite: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        statutMMF: { type: string, enum: [Nouveau, EnAttente, Finance, RemboursementEnCours, Solde] }

    CompteBeneficiaire:
      type: object
      properties:
        beneficiaire: { $ref: '#/components/schemas/Beneficiaire' }
        situation:
          type: object
          properties:
            nombreFinancements: { type: integer }
            totalAttribue: { type: number }
            totalDu: { type: number }
            totalRembourse: { type: number }
            resteAPayer: { type: number }
        financements:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              codeFinancement: { type: string }
              montantAttribue: { type: number }
              montantDu: { type: number }
              montantRembourse: { type: number }
              resteAPayer: { type: number }
              soldee: { type: boolean }

    RapportGenere:
      type: object
      properties:
        id: { type: integer }
        periodeDebut: { type: string, format: date }
        periodeFin: { type: string, format: date }
        nombreBeneficiaires: { type: integer }
        montantTotalFinance: { type: number }
        montantTotalRembourse: { type: number }
        tauxRemboursement: { type: number }
        nombreRetards: { type: integer }
        dateGeneration: { type: string, format: date-time }

    ConseillerIAEchange:
      type: object
      properties:
        id: { type: integer }
        beneficiaireId: { type: integer, nullable: true }
        cantonId: { type: integer, nullable: true }
        question: { type: string }
        reponse: { type: string, description: "Peut contenir des titres de section au format '## Titre' pour une analyse complète" }
        dateCreation: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: integer }
        titre: { type: string }
        message: { type: string }
        lue: { type: boolean }
        dateCreation: { type: string, format: date-time }
