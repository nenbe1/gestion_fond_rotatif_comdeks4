openapi: 3.0.3
info:
  title: API Fonds Rotatif MMF — COMDEKS4
  description: |
    API REST de gestion du Fonds Rotatif MMF (Mutual Micro Fund) des femmes
    et jeunes bénéficiaires, projet COMDEKS4 (AJEOV Technologies).

    ## Authentification
    Toutes les routes (sauf `/authentification/inscription` et
    `/authentification/connexion`) nécessitent un token JWT, obtenu via
    `/authentification/connexion` et transmis dans l'en-tête
    `Authorization: Bearer <token>`. Le token expire après 7 jours.

    ## Rôles applicatifs
    - **RESPONSABLE** — supervision globale, Web uniquement.
    - **MEMBRE_COMITE** — gestion de terrain, Mobile uniquement, restreint
      à son propre canton pour les bénéficiaires.
    - **BENEFICIAIRE** — consultation de sa propre situation, Mobile
      uniquement.
    - **AUTORITE** — consultation de statistiques filtrées selon un
      critère (domaine, sexe, ou âge maximum), Web.

    Certaines actions sont en plus soumises à un système d'habilitations
    par fonction (module Paramétrage), en complément du contrôle de rôle.
  version: '1.0.0'
  contact:
    name: AJEOV Technologies — Projet COMDEKS4

servers:
  - url: http://localhost:5000/api
    description: Serveur de développement local

tags:
  - name: Authentification
  - name: Bénéficiaires
  - name: Membres du comité
  - name: Demandes de financement
  - name: Validations
  - name: Financements
  - name: Attributions
  - name: Remboursements
  - name: Domaines
  - name: Vagues
  - name: Programmes
  - name: Fonds rotatif
  - name: Rapports
  - name: Autorités
  - name: Paramètres
  - name: Paramétrage (cantons, fonctions, habilitations)
  - name: Administration
  - name: Conseiller IA
  - name: Groupes MMF
  - name: Cotisations
  - name: Notifications

security:
  - bearerAuth: []

paths:
  # =====================================================================
  # AUTHENTIFICATION — seules routes publiques (pas de token requis)
  # =====================================================================
  /authentification/inscription:
    post:
      tags: [Authentification]
      summary: Créer un compte (auto-inscription, cas d'usage limité)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom, prenom, sexe, telephone, mot_de_passe]
              properties:
                nom: { type: string, minLength: 2 }
                prenom: { type: string, minLength: 2 }
                sexe: { type: string, enum: [M, F] }
                telephone: { type: string, pattern: '^\+?[0-9]{8,15}$' }
                mot_de_passe: { type: string, minLength: 6, format: password }
      responses:
        '201': { description: Compte créé, token renvoyé, content: { application/json: { schema: { $ref: '#/components/schemas/ReponseAuth' } } } }
        '400': { $ref: '#/components/responses/ErreurValidation' }

  /authentification/connexion:
    post:
      tags: [Authentification]
      summary: Se connecter (téléphone + mot de passe)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telephone, mot_de_passe]
              properties:
                telephone: { type: string }
                mot_de_passe: { type: string, format: password }
      responses:
        '200': { description: Connexion réussie, token renvoyé, content: { application/json: { schema: { $ref: '#/components/schemas/ReponseAuth' } } } }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '401': { description: Identifiants incorrects }
        '403': { description: Compte désactivé }

  # =====================================================================
  # BÉNÉFICIAIRES
  # =====================================================================
  /beneficiaires:
    post:
      tags: [Bénéficiaires]
      summary: Créer un bénéficiaire
      description: Réservé au comité (rôle MEMBRE_COMITE + habilitation GERER_BENEFICIAIRES) — jamais depuis le Web.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom, prenom, sexe, telephone, mot_de_passe]
              properties:
                nom: { type: string, minLength: 2 }
                prenom: { type: string, minLength: 2 }
                sexe: { type: string, enum: [M, F] }
                telephone: { type: string, pattern: '^\+?[0-9]{8,15}$' }
                mot_de_passe: { type: string, minLength: 6 }
                age_estime: { type: integer, nullable: true }
                activite: { type: string, nullable: true }
                latitude: { type: number, format: double, minimum: -90, maximum: 90, nullable: true }
                longitude: { type: number, format: double, minimum: -180, maximum: 180, nullable: true }
      responses:
        '201': { description: Bénéficiaire créé, content: { application/json: { schema: { type: object, properties: { beneficiaire: { $ref: '#/components/schemas/Beneficiaire' } } } } } }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }
    get:
      tags: [Bénéficiaires]
      summary: Lister les bénéficiaires
      description: Un membre du comité ne voit que les bénéficiaires de son propre canton ; la Responsable voit tout.
      parameters:
        - name: cantonId
          in: query
          schema: { type: integer }
          description: Filtre optionnel par canton (Responsable uniquement, ignoré pour le comité)
      responses:
        '200': { description: Liste des bénéficiaires, content: { application/json: { schema: { type: object, properties: { beneficiaires: { type: array, items: { $ref: '#/components/schemas/Beneficiaire' } } } } } } }

  /beneficiaires/{id}/photo:
    post:
      tags: [Bénéficiaires]
      summary: Uploader/remplacer la photo d'un bénéficiaire
      description: Étape séparée de la création, optionnelle. Réservé au comité.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: 'JPEG, PNG ou WEBP, 3 Mo max' }
      responses:
        '200': { description: Photo enregistrée, content: { application/json: { schema: { type: object, properties: { compte: { $ref: '#/components/schemas/Beneficiaire' } } } } } }
        '400': { description: 'Aucune photo reçue, ou format non supporté' }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /beneficiaires/moi/compte:
    get:
      tags: [Bénéficiaires]
      summary: Consulter mon propre compte (bénéficiaire connecté)
      responses:
        '200': { description: Compte complet (infos + financements + situation), content: { application/json: { schema: { $ref: '#/components/schemas/CompteBeneficiaire' } } } }
        '403': { description: "L'utilisateur connecté n'est pas un bénéficiaire" }

  /beneficiaires/{id}:
    get:
      tags: [Bénéficiaires]
      summary: Consulter un bénéficiaire par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail du bénéficiaire, content: { application/json: { schema: { type: object, properties: { beneficiaire: { $ref: '#/components/schemas/Beneficiaire' } } } } } }
        '404': { $ref: '#/components/responses/ErreurNonTrouve' }
    put:
      tags: [Bénéficiaires]
      summary: Modifier un bénéficiaire
      description: Réservé au comité (qui l'a créé) ou à la Responsable. Tous les champs sont optionnels — seuls les champs fournis sont modifiés.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nom: { type: string }
                prenom: { type: string }
                telephone: { type: string }
                sexe: { type: string, enum: [M, F] }
                age_estime: { type: integer }
                activite: { type: string }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '200': { description: Bénéficiaire modifié, content: { application/json: { schema: { type: object, properties: { beneficiaire: { $ref: '#/components/schemas/Beneficiaire' } } } } } }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }
        '409': { description: 'Ce numéro de téléphone est déjà utilisé par un autre compte' }
    delete:
      tags: [Bénéficiaires]
      summary: Supprimer définitivement un bénéficiaire
      description: Réservé au comité ou à la Responsable. Suppression réelle (pas de désactivation).
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '204': { description: Supprimé }
        '403': { $ref: '#/components/responses/ErreurAcces' }
        '404': { $ref: '#/components/responses/ErreurNonTrouve' }

  /beneficiaires/{id}/recalculer-statut:
    post:
      tags: [Bénéficiaires]
      summary: Recalculer le statut MMF d'un bénéficiaire
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Statut recalculé }

  # =====================================================================
  # MEMBRES DU COMITÉ
  # =====================================================================
  /membres-comite/reference/fonctions:
    get:
      tags: [Membres du comité]
      summary: Liste de référence des fonctions du comité
      responses:
        '200': { description: 'Liste (Président, Vice-président, Secrétaire, Trésorier, Commissaire aux comptes, Membre)' }

  /membres-comite/reference/cantons:
    get:
      tags: [Membres du comité]
      summary: Liste de référence des cantons
      responses:
        '200': { description: Liste des cantons }
    post:
      tags: [Membres du comité]
      summary: Créer un canton
      description: Réservé à la Responsable.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [nom]
              properties:
                nom: { type: string }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '201': { description: Canton créé }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /membres-comite:
    post:
      tags: [Membres du comité]
      summary: Créer un membre du comité
      description: Réservé à la Responsable ou à un membre habilité GERER_MEMBRES_COMITE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom, prenom, sexe, telephone, mot_de_passe, fonction_id, canton_id]
              properties:
                nom: { type: string }
                prenom: { type: string }
                sexe: { type: string, enum: [M, F] }
                telephone: { type: string }
                mot_de_passe: { type: string, minLength: 6 }
                fonction_id: { type: integer }
                canton_id: { type: integer }
      responses:
        '201': { description: Membre créé }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }
    get:
      tags: [Membres du comité]
      summary: Lister les membres du comité
      responses:
        '200': { description: Liste des membres du comité }

  /membres-comite/{id}:
    get:
      tags: [Membres du comité]
      summary: Consulter un membre du comité par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail du membre }
    put:
      tags: [Membres du comité]
      summary: Modifier un membre du comité
      description: fonction_id et canton_id restent obligatoires ; nom/prénom/sexe/téléphone optionnels.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [fonction_id, canton_id]
              properties:
                fonction_id: { type: integer }
                canton_id: { type: integer }
                nom: { type: string }
                prenom: { type: string }
                sexe: { type: string, enum: [M, F] }
                telephone: { type: string }
      responses:
        '200': { description: Membre modifié }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  # =====================================================================
  # DEMANDES DE FINANCEMENT
  # =====================================================================
  /demandes-financement:
    post:
      tags: [Demandes de financement]
      summary: Créer une demande de financement
      description: Réservé au comité (rôle MEMBRE_COMITE + habilitation CREER_DEMANDE_FINANCEMENT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vague_id, domaine_id, objet_demande, montant_demande]
              properties:
                vague_id: { type: integer }
                domaine_id: { type: integer }
                objet_demande: { type: string, minLength: 5 }
                montant_demande: { type: number, minimum: 0.01 }
                nb_femmes_benef: { type: integer, minimum: 0 }
                nb_hommes_benef: { type: integer, minimum: 0 }
                beneficiaires_prevus:
                  type: array
                  items:
                    type: object
                    description: 'Exactement un des deux champs par élément : beneficiaire_id (compte existant) ou nom_libre (pas encore de compte)'
                    properties:
                      beneficiaire_id: { type: integer, nullable: true }
                      nom_libre: { type: string, nullable: true }
      responses:
        '201': { description: Demande créée, lance le circuit de validation }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }
    get:
      tags: [Demandes de financement]
      summary: Lister les demandes de financement
      responses:
        '200': { description: Liste des demandes }

  /demandes-financement/{id}:
    get:
      tags: [Demandes de financement]
      summary: Consulter une demande par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail de la demande }

  /demandes-financement/{id}/beneficiaires-prevus:
    get:
      tags: [Demandes de financement]
      summary: Lister les bénéficiaires prévus pour une demande
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Liste des bénéficiaires prévisionnels }

  /demandes-financement/{id}/decision-responsable:
    put:
      tags: [Demandes de financement]
      summary: Décision finale de la Responsable sur une demande déjà validée par le circuit du comité
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [Approuve, Rejete] }
      responses:
        '200': { description: Décision enregistrée }

  # =====================================================================
  # VALIDATIONS (circuit à 3 niveaux : Trésorier → Commissaire → Président)
  # =====================================================================
  /validations/demande/{demandeId}:
    get:
      tags: [Validations]
      summary: Consulter le circuit de validation d'une demande de financement
      parameters:
        - name: demandeId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Les 3 étapes du circuit avec leur statut }

  /validations/remboursement-collectif/{remboursementCollectifId}:
    get:
      tags: [Validations]
      summary: Consulter le circuit de validation d'un remboursement collectif
      parameters:
        - name: remboursementCollectifId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Les 3 étapes du circuit avec leur statut }

  /validations/{id}/traiter:
    put:
      tags: [Validations]
      summary: Traiter une étape du circuit (Trésorier, Commissaire ou Président)
      description: "Le membre connecté doit avoir la fonction correspondant exactement au niveau de l'étape."
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [Approuve, Rejete] }
                commentaire: { type: string, nullable: true }
      responses:
        '200': { description: 'Étape traitée — fait avancer le circuit ou le clôt si rejeté' }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { description: "La fonction du membre connecté ne correspond pas au niveau de l'étape" }

  # =====================================================================
  # FINANCEMENTS
  # =====================================================================
  /financements:
    get:
      tags: [Financements]
      summary: Lister les financements
      responses:
        '200': { description: Liste des financements }

  /financements/{id}:
    get:
      tags: [Financements]
      summary: Consulter un financement par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail du financement }
    put:
      tags: [Financements]
      summary: Modifier un financement
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Financement modifié }
    delete:
      tags: [Financements]
      summary: Supprimer un financement
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '204': { description: Supprimé }

  # =====================================================================
  # ATTRIBUTIONS (répartition d'un financement entre bénéficiaires)
  # =====================================================================
  /attributions:
    post:
      tags: [Attributions]
      summary: Attribuer une part d'un financement à un bénéficiaire
      description: Réservé au comité.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [financement_id, beneficiaire_id, montant_attribue]
              properties:
                financement_id: { type: integer }
                beneficiaire_id: { type: integer }
                montant_attribue: { type: number, minimum: 0.01 }
      responses:
        '201': { description: Attribution créée }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /attributions/financement/{financementId}:
    get:
      tags: [Attributions]
      summary: Lister les attributions d'un financement
      parameters:
        - name: financementId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Liste des attributions }

  /attributions/{id}:
    get:
      tags: [Attributions]
      summary: Consulter une attribution par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail de l'attribution }

  /attributions/{id}/reste-a-payer:
    get:
      tags: [Attributions]
      summary: Reste à payer sur cette attribution (majoration incluse)
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Montant restant dû }

  # =====================================================================
  # REMBOURSEMENTS
  # =====================================================================
  /remboursements/individuel:
    post:
      tags: [Remboursements]
      summary: Enregistrer un remboursement individuel
      description: Réservé au comité — le bénéficiaire remet l'argent physiquement, le comité l'enregistre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attribution_financement_id, montant, date_versement]
              properties:
                attribution_financement_id: { type: integer }
                montant: { type: number, minimum: 0.01 }
                date_versement: { type: string, format: date }
      responses:
        '201': { description: 'Remboursement enregistré, statut EnAttente' }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /remboursements/individuel/{id}/confirmer:
    put:
      tags: [Remboursements]
      summary: Confirmer un remboursement individuel (double validation)
      description: Soumis au système d'habilitations (CONFIRMER_REMBOURSEMENT).
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Remboursement confirmé, compte désormais dans la situation financière }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /remboursements/individuel/{id}/rejeter:
    put:
      tags: [Remboursements]
      summary: Rejeter un remboursement individuel
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Remboursement rejeté }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /remboursements/individuel/attribution/{attributionId}:
    get:
      tags: [Remboursements]
      summary: Lister les remboursements individuels d'une attribution
      parameters:
        - name: attributionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Liste des remboursements individuels }

  /remboursements/collectif:
    post:
      tags: [Remboursements]
      summary: Créer une échéance de remboursement collectif
      description: Réservé au comité.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [financement_id, numero_semaine, date_prevue, montant_prevu]
              properties:
                financement_id: { type: integer }
                numero_semaine: { type: integer, minimum: 1 }
                date_prevue: { type: string, format: date }
                montant_prevu: { type: number, minimum: 0.01 }
      responses:
        '201': { description: Échéance créée }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /remboursements/collectif/en-attente-responsable:
    get:
      tags: [Remboursements]
      summary: Lister les remboursements collectifs en attente de décision de la Responsable
      description: Réservé à la Responsable.
      responses:
        '200': { description: Liste en attente }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /remboursements/collectif/financement/{financementId}:
    get:
      tags: [Remboursements]
      summary: Lister les échéances de remboursement collectif d'un financement
      parameters:
        - name: financementId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Liste des échéances }

  /remboursements/collectif/{id}:
    get:
      tags: [Remboursements]
      summary: Consulter une échéance de remboursement collectif par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail de l'échéance }

  /remboursements/collectif/{id}/decision-responsable:
    put:
      tags: [Remboursements]
      summary: Décision finale de la Responsable sur un remboursement collectif
      description: Réservé à la Responsable, une fois le circuit interne du comité terminé.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [Approuve, Rejete] }
      responses:
        '200': { description: Décision enregistrée }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  # =====================================================================
  # DOMAINES / VAGUES / PROGRAMMES / FONDS ROTATIF (données de référence — module Paramétrage)
  # =====================================================================
  /domaines:
    get:
      tags: [Domaines]
      summary: Lister les domaines d'activité
      responses:
        '200': { description: Liste des domaines }
    post:
      tags: [Domaines]
      summary: Créer un domaine
      description: Réservé à la Responsable.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [nom], properties: { nom: { type: string, minLength: 2 } } }
      responses:
