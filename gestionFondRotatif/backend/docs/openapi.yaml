    get:
      tags: [Rapports]
      summary: Détail nominatif des bénéficiaires financés sur la période du rapport
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Liste détaillée }

  /rapports/{id}:
    get:
      tags: [Rapports]
      summary: Consulter un rapport par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail du rapport }
    delete:
      tags: [Rapports]
      summary: Supprimer un rapport
      description: Soumis au système d'habilitations (SUPPRIMER_RAPPORT).
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '204': { description: Supprimé }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  # =====================================================================
  # AUTORITÉS
  # =====================================================================
  /autorites/moi/statistiques:
    get:
      tags: [Autorités]
      summary: Consulter mes statistiques (autorité connectée)
      description: Filtrées automatiquement selon le critère propre à cette autorité (domaine, sexe, ou âge maximum).
      responses:
        '200': { description: Statistiques filtrées }

  /autorites:
    post:
      tags: [Autorités]
      summary: Créer une autorité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom, prenom, sexe, telephone, mot_de_passe, fonction, type_critere]
              properties:
                nom: { type: string }
                prenom: { type: string }
                sexe: { type: string, enum: [M, F] }
                telephone: { type: string }
                mot_de_passe: { type: string, minLength: 6 }
                fonction: { type: string, minLength: 3, example: 'Délégué départemental de la Jeunesse' }
                type_critere: { type: string, enum: [DOMAINE, SEXE, AGE_MAX] }
                domaine_id: { type: integer, nullable: true, description: 'Requis si type_critere = DOMAINE' }
                valeur_critere: { type: string, nullable: true, description: "Requis si type_critere = SEXE ('M'/'F') ou AGE_MAX (nombre)" }
      responses:
        '201': { description: Autorité créée }
        '400': { $ref: '#/components/responses/ErreurValidation' }
    get:
      tags: [Autorités]
      summary: Lister les autorités
      responses:
        '200': { description: Liste des autorités }

  /autorites/{id}:
    get:
      tags: [Autorités]
      summary: Consulter une autorité par id
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Détail de l'autorité }
    put:
      tags: [Autorités]
      summary: Modifier une autorité
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      responses:
        '200': { description: Autorité modifiée }
        '400': { $ref: '#/components/responses/ErreurValidation' }

  # =====================================================================
