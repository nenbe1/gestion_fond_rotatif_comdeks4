      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cle, valeur]
              properties:
                cle: { type: string, example: taux_majoration_remboursement }
                valeur: { type: string }
                description: { type: string, nullable: true }
      responses:
        '201': { description: Paramètre créé }
        '400': { description: 'Clé inconnue, ou valeur manquante' }
        '403': { $ref: '#/components/responses/ErreurAcces' }

  /parametres/cle/{cle}:
    get:
      tags: [Paramètres]
      summary: Consulter un paramètre par sa clé
      parameters:
        - name: cle
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Valeur du paramètre }

  /parametres/{id}:
    put:
      tags: [Paramètres]
      summary: Modifier la valeur d'un paramètre
      description: Réservé à la Responsable.
      parameters: [{ $ref: '#/components/parameters/IdEnChemin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [valeur], properties: { valeur: { type: string } } }
      responses:
        '200': { description: Paramètre modifié }
        '403': { $ref: '#/components/responses/ErreurAcces' }

