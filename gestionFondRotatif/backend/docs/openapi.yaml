      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periode_debut, periode_fin]
              properties:
                periode_debut: { type: string, format: date }
                periode_fin: { type: string, format: date }
      responses:
        '201': { description: Rapport généré, content: { application/json: { schema: { type: object, properties: { rapport: { $ref: '#/components/schemas/RapportGenere' } } } } } }
        '400': { $ref: '#/components/responses/ErreurValidation' }
        '403': { $ref: '#/components/responses/ErreurAcces' }
    get:
      tags: [Rapports]
      summary: Lister tous les rapports déjà générés
      responses:
        '200': { description: Liste des rapports }

  /rapports/remboursements-par-canton:
    get:
      tags: [Rapports]
      summary: Répartition des remboursements confirmés par canton
      responses:
        '200': { description: 'Une ligne par canton : montant remboursé, nombre de remboursements' }

  /rapports/{id}/pdf:
    get:
      tags: [Rapports]
      summary: Télécharger un rapport au format PDF
